name: Android Build (ARM64 Fix)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 方案1: 使用 x86_64 GitHub Actions Runner (最简单)
  build-x86:
    name: Build on x86_64 (Recommended)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission
        run: chmod +x ./gradlew
      
      - name: Build APK
        run: ./gradlew assembleDebug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # 方案2: Box64 模拟 (ARM64 环境)
  build-arm64-box64:
    name: ARM64 with Box64
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install Box64
        run: |
          sudo apt-get update
          sudo apt-get install -y wget git build-essential cmake
          cd /tmp
          git clone --depth 1 https://github.com/ptitSeb/box64.git
          cd box64
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo
          make -j$(nproc)
          sudo make install
          sudo ldconfig
      
      - name: Build with Box64
        env:
          BOX64_LOG: 0
        run: ./gradlew assembleDebug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-arm64
          path: app/build/outputs/apk/debug/*.apk

  # 方案3: ARM64 原生构建工具
  build-arm64-native:
    name: ARM64 Native Tools
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      
      - name: Install ARM64 native tools
        run: |
          curl -fsSL https://raw.githubusercontent.com/Commit451/android-arm-build-tools/main/install.sh | bash
      
      - name: Build APK
        run: ./gradlew assembleDebug